<body>

    <div class="video-wrapper" id="video-wrapper">
        <video id="video" playsinline></video>
        
        <div class="error-box" id="error-box">
            <i class="fas fa-video-slash" style="font-size: 2rem; margin-bottom:10px;"></i><br>
            <span id="error-text">Stream Offline</span>
        </div>

        <div class="loader-overlay" id="loader">
            <div class="spinner-ring"></div>
            <div class="status-text" id="status-text">Processing Stream...</div>
            <div id="loader-sub" class="text-muted mt-2" style="font-size:0.75rem;">Initializing STUDY BEE Vault</div>
        </div>

        <div class="controls-overlay" id="controls">
            <div class="top-bar">
                <div class="top-left">
                    <i class="fas fa-arrow-left back-btn" onclick="window.close()"></i>
                    <div class="video-title" id="video-title">Class Player</div>
                </div>
                 <div class="top-icons">
                    <i class="fas fa-download icon-btn" id="top-dl-btn" style="display: none;" title="Download Video"></i>
                    <i class="fas fa-ellipsis-v icon-btn" onclick="openPanel('menu-panel')"></i>
                </div>
            </div>

            <div class="center-area" id="center-click-area">
                <div class="play-pause-center" id="center-play-btn"><i class="fas fa-play"></i></div>
            </div>

            <div class="bottom-gradient">
                <div class="time-display"><span id="current-time">00:00</span> / <span id="duration-time">00:00</span></div>
                
                <div class="progress-wrapper" id="progress-wrapper">
                    <div class="progress-track" id="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                        <div id="slide-markers"></div>
                    </div>
                </div>
                
                <div class="controls-row">
                    <div class="controls-left">
                        <div class="play-btn" id="play-btn" onclick="togglePlay()"><i class="fas fa-play"></i></div>
                        <div class="skip-btn" onclick="seekVideo(-10)"><i class="fas fa-undo-alt"></i><span class="skip-text">10</span></div>
                        <div class="skip-btn" onclick="seekVideo(10)"><i class="fas fa-redo-alt"></i><span class="skip-text">10</span></div>
                        <div class="vol-btn" onclick="toggleMute()"><i class="fas fa-volume-up" id="vol-icon"></i></div>
                    </div>
                    <div class="controls-right">
                        <div class="gear-btn" onclick="toggleSettings()"><i class="fas fa-cog"></i></div>
                        <div class="fullscreen-btn" id="fullscreen-btn"><i class="fas fa-expand"></i></div>
                    </div>
                </div>
            </div>
            
            <div class="settings-float" id="settings-float">
                <div class="float-item" onclick="cycleSpeed()"><span>Speed</span><span class="float-val"><span id="speed-val">1x</span> <i class="fas fa-chevron-right ms-1"></i></span></div>
                <div class="float-item" onclick="cycleQuality()"><span>Quality</span><span class="float-val"><span id="quality-val">Auto</span> <i class="fas fa-chevron-right ms-1"></i></span></div>
            </div>
        </div>
    </div>

    <div class="sheet-overlay" id="sheet-overlay" onclick="closePanels(event)">
        <div class="bottom-sheet" id="menu-panel">
            <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
            <ul class="menu-list mt-2">
                <li class="menu-item" onclick="copyLink()"><i class="fas fa-link menu-icon"></i> Copy Link</li>
            </ul>
        </div>
        <div class="bottom-sheet" id="chat-panel" style="height: 75vh;">
            <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
            
            
            
            <div class="text-center py-3 bg-white border-top" id="load-more-btn" style="display:none;" onclick="loadComments(true)">
                <span class="text-primary fw-bold" style="font-size:0.9rem; cursor:pointer;"><i class="fas fa-chevron-down"></i> Load More Comments</span>
            </div>
        </div>

        
    </div>
    
    
</body>
</html>
